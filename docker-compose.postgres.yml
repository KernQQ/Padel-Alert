services:
  postgres:
    image: postgres:16-alpine
    container_name: padelalert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: padelalert
      POSTGRES_USER: padelalert
      POSTGRES_PASSWORD: padelalert_dev
    ports:
      - "5432:5432"
    volumes:
      - padelalert_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padelalert -d padelalert"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  padelalert_postgres_data:
